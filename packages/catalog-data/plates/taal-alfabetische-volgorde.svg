<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="16" font-size="11" text-anchor="middle">Op alfabetische volgorde</text><text class="tx" x="100" y="28" font-size="6.4" text-anchor="middle">Zet de woorden op volgorde van het alfabet (a, b, c …).</text><text class="tx" x="14" y="46" font-size="7" text-anchor="start">1.</text><text class="tx" x="26" y="46" font-size="8.5" text-anchor="start">vis, maan, appel</text><path class="guide" d="M26 61L184 61"/><text class="tx" x="14" y="82" font-size="7" text-anchor="start">2.</text><text class="tx" x="26" y="82" font-size="8.5" text-anchor="start">zon, huis, kat, beer</text><path class="guide" d="M26 97L184 97"/><text class="tx" x="14" y="118" font-size="7" text-anchor="start">3.</text><text class="tx" x="26" y="118" font-size="8.5" text-anchor="start">tafel, deur, bed, lamp</text><path class="guide" d="M26 133L184 133"/><text class="tx" x="14" y="154" font-size="7" text-anchor="start">4.</text><text class="tx" x="26" y="154" font-size="8.5" text-anchor="start">ijs, nest, uil, peer, fiets</text><path class="guide" d="M26 169L184 169"/><text class="tx" x="14" y="190" font-size="7" text-anchor="start">5.</text><text class="tx" x="26" y="190" font-size="8.5" text-anchor="start">giraf, wolk, oma, egel, raket</text><path class="guide" d="M26 205L184 205"/></svg>
