<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="16" font-size="11" text-anchor="middle">6 bij 6</text><text class="tx" x="20" y="30" font-size="6.2" text-anchor="start">Vul elk vakje met 0 of 1:</text><text class="tx" x="20" y="38" font-size="6.2" text-anchor="start">1. Nooit drie dezelfde cijfers naast of onder elkaar.</text><text class="tx" x="20" y="46" font-size="6.2" text-anchor="start">2. In elke rij en kolom evenveel nullen als enen (3 van elk).</text><text class="tx" x="20" y="54" font-size="6.2" text-anchor="start">3. Geen twee rijen zijn hetzelfde, en geen twee kolommen.</text><path class="l" d="M58 66L58 150" style="stroke-width:.8"/><path class="l" d="M58 66L142 66" style="stroke-width:.8"/><path class="l" d="M72 66L72 150" style="stroke-width:.8"/><path class="l" d="M58 80L142 80" style="stroke-width:.8"/><path class="l" d="M86 66L86 150" style="stroke-width:.8"/><path class="l" d="M58 94L142 94" style="stroke-width:.8"/><path class="l" d="M100 66L100 150" style="stroke-width:.8"/><path class="l" d="M58 108L142 108" style="stroke-width:.8"/><path class="l" d="M114 66L114 150" style="stroke-width:.8"/><path class="l" d="M58 122L142 122" style="stroke-width:.8"/><path class="l" d="M128 66L128 150" style="stroke-width:.8"/><path class="l" d="M58 136L142 136" style="stroke-width:.8"/><path class="l" d="M142 66L142 150" style="stroke-width:.8"/><path class="l" d="M58 150L142 150" style="stroke-width:.8"/><text class="tx" x="107" y="75.8" font-size="9" text-anchor="middle" font-weight="700">1</text><text class="tx" x="93" y="89.8" font-size="9" text-anchor="middle" font-weight="700">0</text><text class="tx" x="121" y="89.8" font-size="9" text-anchor="middle" font-weight="700">0</text><text class="tx" x="93" y="103.8" font-size="9" text-anchor="middle" font-weight="700">0</text><text class="tx" x="135" y="131.8" font-size="9" text-anchor="middle" font-weight="700">1</text><text class="tx" x="65" y="145.8" font-size="9"