<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="15" font-size="11" text-anchor="middle">Papieren fototoestel</text><rect class="r" data-i="0" x="32.5" y="30.5" width="135" height="81.5" rx="4"/><g transform="rotate(180 100 70.0)"><rect class="r" data-i="1" x="46" y="40" width="22" height="16" rx="3"/><rect class="r" data-i="2" x="50" y="43" width="14" height="10" rx="2"/><text class="tip" x="100" y="78" font-size="6" text-anchor="middle">achterkant</text><path class="l" d="M126 62L126 92" style="stroke-width:1.2"/><path class="l" d="M132 62L132 92" style="stroke-width:1.2"/><path class="l" d="M138 62L138 92" style="stroke-width:1.2"/><path class="l" d="M144 62L144 92" style="stroke-width:1.2"/><path class="l" d="M150 62L150 92" style="stroke-width:1.2"/><path class="l" d="M156 62L156 92" style="stroke-width:1.2"/></g><rect class="glue" x="23" y="34" width="7" height="72"/><rect class="glue" x="170" y="34" width="7" height="72"/><rect class="r" data-i="3" x="32.5" y="112" width="135" height="81.5" rx="4"/><path class="r" data-i="4" d="M32.5 112 L167.5 112 L167.5 126 L32.5 126Z"/><rect class="r" data-i="5" x="42" y="134" width="22" height="12" rx="2"/><text class="tip" x="53" y="142.5" font-size="4.8" text-anchor="middle">flits</text><rect class="r" data-i="6" x="140" y="134" width="18" height="12" rx="2"/><circle class="r" data-i="7" cx="149" cy="160" r="6"/><circle class="r" data-i="8" cx="100" cy="150" r="23"/><circle class="r" data-i="9" cx="100" cy="150" r="17"/><circle class="r" data-i="10" cx="100" cy="150" r="11"/><circle class="r" data-i="11" cx="95" cy="145" r="3"/><rect class="r" data-i="12" x="52" y="184" width="96" height="5" rx="2"/><text class="tip" x="100" y="181" font-size="4.8" text-anchor="middle">hier komt de foto uit</text><path class="fold" d="M30 112L170 112"/><path class="fold" d="M30 28L30 112"/><path class="fold" d="M170 28L170 112"/><path class="cut" d="M30 196V112L23 106V34L30 28H170L177 34V106L170 112V196Z"/><text class="tx" x="100" y="210" font-size="7" text-anchor="middle">Zo maak je hem:</text><text class="tx" x="18" y="222" font-size="6" text-anchor="start">1. Knip het fototoestel uit langs de streepjeslijn.</text><text class="tx" x="18" y="232" font-size="6" text-anchor="start">2. Vouw de grijze flapjes naar achteren en smeer er lijm op.</text><text class="tx" x="18" y="242" font-size="6" text-anchor="start">3. Vouw de achterkant naar achteren, achter de voorkant.</text><text class="tx" x="18" y="252" font-size="6" text-anchor="start">4. Schuif een foto van onderen in het toestel. Klik!</text><path class="cut" d="M20 275L34 275"/><text class="tip" x="37" y="277" font-size="6" text-anchor="start">knippen</text><path class="fold" d="M72 275L86 275"/><text class="tip" x="89" y="277" font-size="6" text-anchor="start">vouwen</text><rect class="glue" x="124" y="272" width="10" height="6"/><text class="tip" x="137" y="277" font-size="6" text-anchor="start">lijmen</text></svg>
