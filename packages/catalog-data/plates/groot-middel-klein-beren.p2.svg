<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="16" font-size="11" text-anchor="middle">Wie hoort waar?</text><text class="tx" x="100" y="27" font-size="6.5" text-anchor="middle">Plak de grote spullen bij de grote beer, enzovoort.</text><rect class="l" x="10" y="40" width="180" height="76" rx="4" style="stroke-width:.8" fill="none"/><text class="tx" x="14" y="49" font-size="7" text-anchor="start">groot</text><rect class="l" x="10" y="116" width="180" height="66" rx="4" style="stroke-width:.8" fill="none"/><text class="tx" x="14" y="125" font-size="7" text-anchor="start">middel</text><rect class="l" x="10" y="192" width="180" height="56" rx="4" style="stroke-width:.8" fill="none"/><text class="tx" x="14" y="201" font-size="7" text-anchor="start">klein</text></svg>
