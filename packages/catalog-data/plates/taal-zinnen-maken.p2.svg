<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="16" font-size="11" text-anchor="middle">Antwoorden</text><text class="tx" x="100" y="28" font-size="6.4" text-anchor="middle">Zet de woorden op volgorde. Hoofdletter en punt niet vergeten!</text><text class="tx" x="14" y="46" font-size="7" text-anchor="start">1.</text><text class="tx" x="26" y="46" font-size="8.5" text-anchor="start">bank / de / op / de / slaapt / kat</text><path class="guide" d="M26 61L184 61"/><text class="tx" x="28" y="59" font-size="8" text-anchor="start">De kat slaapt op de bank.</text><text class="tx" x="14" y="82" font-size="7" text-anchor="start">2.</text><text class="tx" x="26" y="82" font-size="8.5" text-anchor="start">een / ik / eet / appel</text><path class="guide" d="M26 97L184 97"/><text class="tx" x="28" y="95" font-size="8" text-anchor="start">Ik eet een appel.</text><text class="tx" x="14" y="118" font-size="7" text-anchor="start">3.</text><text class="tx" x="26" y="118" font-size="8.5" text-anchor="start">school / gaan / naar / wij</text><path class="guide" d="M26 133L184 133"/><text class="tx" x="28" y="131" font-size="8" text-anchor="start">Wij gaan naar school.</text><text class="tx" x="14" y="154" font-size="7" text-anchor="start">4.</text><text class="tx" x="26" y="154" font-size="8.5" text-anchor="start">regent / buiten / het</text><path class="guide" d="M26 169L184 169"/><text class="tx" x="28" y="167" font-size="8" text-anchor="start">Het regent buiten.</text><text class="tx" x="14" y="190" font-size="7" text-anchor="start">5.</text><text class="tx" x="26" y="190" font-size="8.5" text-anchor="start">broer / speelt / voetbal / mijn</text><path class="guide" d="M26 205L184 205"/><text class="tx" x="28" y="203" font-size="8" text-anchor="start">Mijn broer speelt voetbal.</text><text class="tx" x="14" y="226" font-size="7" text-anchor="start">6.</text><text class="tx" x="26" y="226" font-size="8.5" text-anchor="start">in / zingt / de / de 