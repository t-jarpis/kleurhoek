<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="15" font-size="11" text-anchor="middle">Het verhaal</text><text class="tx" x="100" y="34" font-size="8" text-anchor="middle">De grote raap (een oud volksverhaal)</text><text class="tx" x="20" y="48" font-size="6.5" text-anchor="start">1.</text><text class="tx" x="28" y="48" font-size="6.2" text-anchor="start">Opa zaait een raapje in de moestuin.</text><text class="tx" x="28" y="56" font-size="6.2" text-anchor="start">Het raapje groeit en groeit en groeit.</text><text class="tx" x="20" y="69" font-size="6.5" text-anchor="start">2.</text><text class="tx" x="28" y="69" font-size="6.2" text-anchor="start">Het wordt een reuzenraap! Opa trekt aan de raap.</text><text class="tx" x="28" y="77" font-size="6.2" text-anchor="start">Hij trekt en trekt... maar de raap zit vast.</text><text class="tx" x="20" y="90" font-size="6.5" text-anchor="start">3.</text><text class="tx" x="28" y="90" font-size="6.2" text-anchor="start">Opa roept oma. Oma trekt aan opa,</text><text class="tx" x="28" y="98" font-size="6.2" text-anchor="start">opa trekt aan de raap. Ze trekken en trekken...</text><text class="tx" x="28" y="106" font-size="6.2" text-anchor="start">maar de raap zit vast.</text><text class="tx" x="20" y="119" font-size="6.5" text-anchor="start">4.</text><text class="tx" x="28" y="119" font-size="6.2" text-anchor="start">Oma roept het meisje. Het meisje trekt aan oma,</text><text class="tx" x="28" y="127" font-size="6.2" text-anchor="start">oma trekt aan opa, opa trekt aan de raap...</text><text class="tx" x="28" y="135" font-size="6.2" text-anchor="start">maar de raap zit nog steeds vast.</text><text class="tx" x="20" y="148" font-size="6.5" text-anchor="start">5.</text><text class="tx" x="28" y="148" font-size="6.2" text-anchor="start">Het meisje roept de hond. De hond roept de kat.</text><text class="tx" x="28" y="156" font-size="6.2" text-anchor="start">Ze trekken allemaal... maar de raap zit vast.</text><text class="tx" x="20" y="169" font-size="6.5" text-anchor="start">6.</text><text class="tx" x="28" y="169" font-size="6.2" text-anchor="start">Dan roept de kat het muisje.</text><text class="tx" x="28" y="177" font-size="6.2" text-anchor="start">Het muisje trekt aan de kat, de kat aan de hond...</text><text class="tx" x="20" y="190" font-size="6.5" text-anchor="start">7.</text><text class="tx" x="28" y="190" font-size="6.2" text-anchor="start">FLOEP! De raap schiet uit de grond.</text><text class="tx" x="28" y="198" font-size="6.2" text-anchor="start">Iedereen valt op een hoop! 's avonds eten ze</text><text class="tx" x="28" y="206" font-size="6.2" text-anchor="start">samen raapsoep. Zelfs het muisje krijgt een kommetje.</text><text class="tx" x="100" y="225" font-size="6.5" text-anchor="middle">Wie trekt aan wie? Zet de stokpoppen in een rij:</text><rect class="l" x="9" y="233" width="22" height="14" rx="3" style="stroke-width:.8" fill="none"/><text class="tx" x="20" y="242.5" font-size="5.5" text-anchor="middle">raap</text><path class="l" d="M32.0 240h3" style="stroke-width:1"/><rect class="l" x="35.7" y="233" width="22" height="14" rx="3" style="stroke-width:.8" fill="none"/><text class="tx" x="46.7" y="242.5" font-size="5.5" text-anchor="middle">opa</text><path class="l" d="M58.7 240h3" style="stroke-width:1"/><rect class="l" x="62.4" y="233" width="22" height="14" rx="3" style="stroke-width:.8" fill="none"/><text class="tx" x="73.4" y="242.5" font-size="5.5" text-anchor="middle">oma</text><path class="l" d="M85.4 240h3" style="stroke-width:1"/><rect class="l" x="89.1" y="233" width="22" height="14" rx="3" style="stroke-width:.8" fill="none"/><text class="tx" x="100.1" y="242.5" font-size="5.5" text-anchor="middle">meisje</text><path class="l" d="M112.1 240h3" style="stroke-width:1"/><rect class="l" x="115.8" y="233" width="22" height="14" rx="3" style="stroke-width:.8" fill="none"/><text class="tx" x="126.8" y="242.5" font-size="5.5" text-anchor="middle">hond</text><path class="l" d="M138.8 240h3" style="stroke-width:1"/><rect class="l" x="142.5" y="233" width="22" height="14" rx="3" style="stroke-width:.8" fill="none"/><text class="tx" x="153.5" y="242.5" font-size="5.5" text-anchor="middle">kat</text><path class="l" d="M165.5 240h3" style="stroke-width:1"/><rect class="l" x="169.2" y="233" width="22" height="14" rx="3" style="stroke-width:.8" fill="none"/><text class="tx" x="180.2" y="242.5" font-size="5.5" text-anchor="middle">muis</text></svg>
