<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="16" font-size="11" text-anchor="middle">Verhaaltjessommen tot 20</text><text class="tx" x="100" y="28" font-size="6.2" text-anchor="middle">Lees het verhaaltje goed. Moet je erbij doen of eraf halen?</text><text class="tx" x="14" y="44" font-size="7" text-anchor="start">1.</text><text class="tx" x="22" y="44" font-size="7" text-anchor="start">Sam heeft 4 knikkers. Hij krijgt er 3 bij.</text><text class="tx" x="22" y="52" font-size="7" text-anchor="start">Hoeveel knikkers heeft hij nu?</text><rect class="ans" x="162" y="56" width="24" height="11" rx="2"/><text class="tx" x="14" y="80" font-size="7" text-anchor="start">2.</text><text class="tx" x="22" y="80" font-size="7" text-anchor="start">Er zitten 9 vogels op een tak. Er vliegen er 5</text><text class="tx" x="22" y="88" font-size="7" text-anchor="start">weg. Hoeveel blijven er zitten?</text><rect class="ans" x="162" y="92" width="24" height="11" rx="2"/><text class="tx" x="14" y="116" font-size="7" text-anchor="start">3.</text><text class="tx" x="22" y="116" font-size="7" text-anchor="start">Mila heeft 6 stickers en Daan heeft er 6.</text><text class="tx" x="22" y="124" font-size="7" text-anchor="start">Hoeveel stickers hebben ze samen?</text><rect class="ans" x="162" y="128" width="24" height="11" rx="2"/><text class="tx" x="14" y="152" font-size="7" text-anchor="start">4.</text><text class="tx" x="22" y="152" font-size="7" text-anchor="start">In een doos zitten 12 eieren. Mama gebruikt er</text><text class="tx" x="22" y="160" font-size="7" text-anchor="start">4 voor een taart. Hoeveel eieren zijn er nog?</text><rect class="ans" x="162" y="164" width="24" height="11" rx="2"/><text class="tx" x="14" y="188" font-size="7" text-anchor="start">5.</text><text class="tx" x="22" y="188" font-size="7" text-anchor="start">Op het plein staan 8 fietsen. Er komen er 7</text><text class="tx" x="22" y="196" font-size="7" text-anchor="start">bij. Hoeveel fietsen staan er nu?</text><rect class="ans" x="162" y="200" width="24" height="11" rx="2"/><text class="tx" x="14" y="224" font-size="7" text-anchor="start">6.</text><text class="tx" x="22" y="224" font-size="7" text-anchor="start">Je hebt 15 snoepjes en geeft er 6 weg. Hoeveel</text><text class="tx" x="22" y="232" font-size="7" text-anchor="start">houd je over?</text><rect class="ans" x="162" y="236" width="24" height="11" rx="2"/></svg>
