<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="16" font-size="11" text-anchor="middle">Antwoorden</text><text class="tx" x="100" y="28" font-size="6.2" text-anchor="middle">Kouder is omlaag, warmer is omhoog op de thermometer.</text><text class="tx" x="14" y="44" font-size="7" text-anchor="start">1.</text><text class="tx" x="22" y="44" font-size="7" text-anchor="start">Het is 3 graden en het wordt 5 graden kouder.</text><text class="tx" x="22" y="52" font-size="7" text-anchor="start">Hoe koud is het dan?</text><rect class="ans" x="152" y="56" width="34" height="11" rx="2"/><text class="tx" x="169" y="64.5" font-size="7" text-anchor="middle">-2 °C</text><text class="tx" x="14" y="80" font-size="7" text-anchor="start">2.</text><text class="tx" x="22" y="80" font-size="7" text-anchor="start">'s Nachts was het -4 graden. Overdag 6 graden</text><text class="tx" x="22" y="88" font-size="7" text-anchor="start">warmer. Hoeveel is het overdag?</text><rect class="ans" x="152" y="92" width="34" height="11" rx="2"/><text class="tx" x="169" y="100.5" font-size="7" text-anchor="middle">2 °C</text><text class="tx" x="14" y="116" font-size="7" text-anchor="start">3.</text><text class="tx" x="22" y="116" font-size="7" text-anchor="start">Het is -1 graad en het wordt 3 graden kouder.</text><rect class="ans" x="152" y="120" width="34" height="11" rx="2"/><text class="tx" x="169" y="128.5" font-size="7" text-anchor="middle">-4 °C</text><text class="tx" x="14" y="152" font-size="7" text-anchor="start">4.</text><text class="tx" x="22" y="152" font-size="7" text-anchor="start">Het verschil tussen -5 en 5 graden?</text><rect class="ans" x="152" y="156" width="34" height="11" rx="2"/><text class="tx" x="169" y="164.5" font-size="7" text-anchor="middle">10 graden</text><text class="tx" x="14" y="188" font-size="7" text-anchor="start">5.</text><text class="tx" x="22" y="188" font-size="7" text-anchor="start">Het is 0 graden en het wordt 7 graden kouder.</text><rect class="ans" x="152" y="192" width="34" height="11" rx="2"/><text class="tx" x="169" y="200.5" font-size="7" text-anchor="middle">-7 °C</text><text class="tx" x="14" y="224" font-size="7" text-anchor="start">6.</text><text class="tx" x="22" y="224" font-size="7" text-anchor="start">Van -8 naar -2 graden: hoeveel warmer?</text><rect class="ans" x="152" y="228" width="34" height="11" rx="2"/><text class="tx" x="169" y="236.5" font-size="7" text-anchor="middle">6 graden</text></svg>
