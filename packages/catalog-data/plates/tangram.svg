<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="16" font-size="11" text-anchor="middle">Tangram</text><text class="tx" x="100" y="27" font-size="6.5" text-anchor="middle">Zeven stukjes, eindeloos veel figuren. Knip ze uit en leg ze na.</text><path class="r" data-i="0" d="M24 40 L176 40 L100 116Z"/><path class="r" data-i="1" d="M24 40 L100 116 L24 192Z"/><path class="r" data-i="2" d="M176 116 L176 192 L100 192Z"/><path class="r" data-i="3" d="M100 116 L138 154 L100 192 L62 154Z"/><path class="r" data-i="4" d="M24 192 L62 154 L100 192Z"/><path class="r" data-i="5" d="M100 116 L138 78 L138 154Z"/><path class="r" data-i="6" d="M176 40 L176 116 L138 154 L138 78Z"/><rect class="cut" x="24" y="40" width="152" height="152" fill="none"/><path class="cut" d="M24 40 L176 40 L100 116Z"/><path class="cut" d="M24 40 L100 116 L24 192Z"/><path class="cut" d="M176 116 L176 192 L100 192Z"/><path class="cut" d="M100 116 L138 154 L100 192 L62 154Z"/><path class="cut" d="M24 192 L62 154 L100 192Z"/><path class="cut" d="M100 116 L138 78 L138 154Z"/><path class="cut" d="M176 40 L176 116 L138 154 L138 78Z"/><text class="tx" x="100" y="210" font-size="6" text-anchor="middle">Leg de figuren op de volgende bladzijde na.</text><text class="tx" x="100" y="218" font-size="6" text-anchor="middle">Alle zeven stukjes doen mee, zonder overlap.</text><path class="cut" d="M20 274L34 274"/><text class="tip" x="37" y="276" font-size="6" text-anchor="start">knippen</text></svg>
