<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="16" font-size="11" text-anchor="middle">Hoe lang duurt het?</text><text class="tx" x="100" y="28" font-size="6.2" text-anchor="middle">Reken uit hoeveel tijd er tussen de twee tijden zit.</text><text class="tx" x="14" y="44" font-size="7" text-anchor="start">1.</text><text class="tx" x="22" y="44" font-size="7" text-anchor="start">Van 8:30 tot 9:15. Hoe lang duurt dat?</text><rect class="ans" x="140" y="48" width="46" height="11" rx="2"/><text class="tx" x="14" y="80" font-size="7" text-anchor="start">2.</text><text class="tx" x="22" y="80" font-size="7" text-anchor="start">Van 13:00 tot 14:40. Hoe lang duurt dat?</text><rect class="ans" x="140" y="84" width="46" height="11" rx="2"/><text class="tx" x="14" y="116" font-size="7" text-anchor="start">3.</text><text class="tx" x="22" y="116" font-size="7" text-anchor="start">Van 10:45 tot 12:05. Hoe lang duurt dat?</text><rect class="ans" x="140" y="120" width="46" height="11" rx="2"/><text class="tx" x="14" y="152" font-size="7" text-anchor="start">4.</text><text class="tx" x="22" y="152" font-size="7" text-anchor="start">Van 15:20 tot 17:00. Hoe lang duurt dat?</text><rect class="ans" x="140" y="156" width="46" height="11" rx="2"/><text class="tx" x="14" y="188" font-size="7" text-anchor="start">5.</text><text class="tx" x="22" y="188" font-size="7" text-anchor="start">Van 7:50 tot 8:25. Hoe lang duurt dat?</text><rect class="ans" x="140" y="192" width="46" height="11" rx="2"/><text class="tx" x="14" y="224" font-size="7" text-anchor="start">6.</text><text class="tx" x="22" y="224" font-size="7" text-anchor="start">Van 18:35 tot 20:10. Hoe lang duurt dat?</text><rect class="ans" x="140" y="228" width="46" height="11" rx="2"/></svg>
