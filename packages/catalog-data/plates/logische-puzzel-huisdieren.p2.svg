<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="15" font-size="11" text-anchor="middle">Antwoorden</text><text class="tx" x="100" y="27" font-size="6.2" text-anchor="middle">Drie kinderen, drie huisdieren, drie kleuren. Wie heeft wat?</text><text class="tx" x="20" y="44" font-size="7" text-anchor="start">1. Daan heeft geen hond.</text><text class="tx" x="20" y="54" font-size="7" text-anchor="start">2. Het kind met de kat houdt van blauw.</text><text class="tx" x="20" y="64" font-size="7" text-anchor="start">3. Mila houdt van rood.</text><text class="tx" x="20" y="74" font-size="7" text-anchor="start">4. Sara heeft geen konijn.</text><text class="tx" x="20" y="84" font-size="7" text-anchor="start">5. Het kind dat van groen houdt, heeft geen kat.</text><text class="tx" x="20" y="94" font-size="7" text-anchor="start">6. Mila heeft geen hond.</text><text class="tx" x="61" y="106" font-size="5.4" text-anchor="middle">hond</text><text class="tx" x="83" y="106" font-size="5.4" text-anchor="middle">kat</text><text class="tx" x="105" y="106" font-size="5.4" text-anchor="middle">konijn</text><text class="tx" x="127" y="106" font-size="5.4" text-anchor="middle">rood</text><text class="tx" x="149" y="106" font-size="5.4" text-anchor="middle">blauw</text><text class="tx" x="171" y="106" font-size="5.4" text-anchor="middle">groen</text><text class="tx" x="46" y="123.6" font-size="7" text-anchor="end">Sara</text><rect class="l" x="50" y="110" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="61" y="125" font-size="9" text-anchor="middle">✓</text><rect class="l" x="72" y="110" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="83" y="125" font-size="9" text-anchor="middle">×</text><rect class="l" x="94" y="110" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="105" y="125" font-size="9" text-anchor="middle">×</text><rect class="l" x="116" y="110" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="127" y="125" font-size="9" text-anchor="middle">×</text><rect class="l" x="138" y="110" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="149" y="125" font-size="9" text-anchor="middle">×</text><rect class="l" x="160" y="110" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="171" y="125" font-size="9" text-anchor="middle">✓</text><text class="tx" x="46" y="145.6" font-size="7" text-anchor="end">Daan</text><rect class="l" x="50" y="132" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="61" y="147" font-size="9" text-anchor="middle">×</text><rect class="l" x="72" y="132" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="83" y="147" font-size="9" text-anchor="middle">✓</text><rect class="l" x="94" y="132" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="105" y="147" font-size="9" text-anchor="middle">×</text><rect class="l" x="116" y="132" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="127" y="147" font-size="9" text-anchor="middle">×</text><rect class="l" x="138" y="132" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="149" y="147" font-size="9" text-anchor="middle">✓</text><rect class="l" x="160" y="132" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="171" y="147" font-size="9" text-anchor="middle">×</text><text class="tx" x="46" y="167.6" font-size="7" text-anchor="end">Mila</text><rect class="l" x="50" y="154" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="61" y="169" font-size="9" text-anchor="middle">×</text><rect class="l" x="72" y="154" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="83" y="169" font-size="9" text-anchor="middle">×</text><rect class="l" x="94" y="154" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="105" y="169" font-size="9" text-anchor="middle">✓</text><rect class="l" x="116" y="154" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="127" y="169" font-size="9" text-anchor="middle">✓</text><rect class="l" x="138" y="154" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="149" y="169" font-size="9" text-anchor="middle">×</text><rect class="l" x="160" y="154" width="22" height="22" style="stroke-width:.7" fill="none"/><text class="tx" x="171" y="169" font-size="9" text-anchor="middle">×</text><path class="l" d="M116 100L116 176" style="stroke-width:1.8"/><text class="tx" x="100" y="196" font-size="6.5" text-anchor="middle">Zet een × waar het niet kan en een ✓ waar het wel moet.</text><text class="tx" x="100" y="216" font-size="7" text-anchor="middle">Sara heeft een hond en houdt van groen.</text><text class="tx" x="100" y="230" font-size="7" text-anchor="middle">Daan heeft een kat en houdt van blauw.</text><text class="tx" x="100" y="244" font-size="7" text-anchor="middle">Mila heeft een konijn en houdt van rood.</text></svg>
