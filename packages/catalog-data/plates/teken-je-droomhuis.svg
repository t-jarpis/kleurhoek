<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="16" font-size="11" text-anchor="middle">Mijn droomhuis</text><text class="tx" x="100" y="27" font-size="6.5" text-anchor="middle">Hoe ziet het huis eruit waar jij het liefst zou wonen?</text><rect class="l" x="14" y="36" width="172" height="180" rx="6" style="stroke-width:1" fill="none"/><text class="tx" x="18" y="230" font-size="6.5" text-anchor="start">• Hoeveel verdiepingen?</text><text class="tx" x="108" y="230" font-size="6.5" text-anchor="start">• Een glijbaan of een toren?</text><text class="tx" x="18" y="244" font-size="6.5" text-anchor="start">• Wie woont er nog meer?</text><text class="tx" x="108" y="244" font-size="6.5" text-anchor="start">• Wat staat er in de tuin?</text></svg>
