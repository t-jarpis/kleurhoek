<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="15" font-size="11" text-anchor="middle">Papieren telefoon</text><rect class="r" data-i="0" x="92.5" y="32.5" width="65" height="119" rx="3"/><rect class="glue" x="160" y="34" width="7" height="116"/><rect class="glue" x="94" y="154" width="62" height="7"/><rect class="r" data-i="1" x="22.5" y="32.5" width="65" height="119" rx="6"/><path class="l" d="M32 36h12" style="stroke-width:2"/><circle class="r" data-i="2" cx="78" cy="36" r="2.2"/><circle class="r" data-i="3" cx="55" cy="140" r="6"/><rect class="cut" x="28" y="42" width="54" height="84" rx="3" fill="none"/><text class="tip" x="55" y="86" font-size="5.5" text-anchor="middle">knip dit</text><text class="tip" x="55" y="93" font-size="5.5" text-anchor="middle">venster uit</text><rect class="r" data-i="4" x="96" y="36" width="20" height="20" rx="4"/><circle class="r" data-i="5" cx="102" cy="42" r="4"/><circle class="r" data-i="6" cx="110" cy="50" r="4"/><circle class="r" data-i="7" cx="110" cy="42" r="1.8"/><path class="r" data-i="8" d="M108 82.3C98.9 76 101.7 69 108 73.2C114.3 69 117.1 76 108 82.3Z"/><path class="r" data-i="9" d="M140 44 L142 49.2 L147.6 49.5 L143.2 53.1 L144.7 58.5 L140 55.4 L135.3 58.5 L136.8 53.1 L132.4 49.5 L138 49.2Z"/><path class="r" data-i="10" d="M140 94.3C130.9 88 133.7 81 140 85.2C146.3 81 149.1 88 140 94.3Z"/><path class="r" data-i="11" d="M108 102 L110 107.2 L115.6 107.5 L111.2 111.1 L112.7 116.5 L108 113.4 L103.3 116.5 L104.8 111.1 L100.4 107.5 L106 107.2Z"/><path class="r" data-i="12" d="M124 140.3C114.9 134 117.7 127 124 131.2C130.3 127 133.1 134 124 140.3Z"/><path class="r" data-i="13" d="M140 114 L142 119.2 L147.6 119.5 L143.2 123.1 L144.7 128.5 L140 125.4 L135.3 128.5 L136.8 123.1 L132.4 119.5 L138 119.2Z"/><path class="fold" d="M90 30L90 154"/><path class="fold" d="M160 30L160 154"/><path class="fold" d="M90 154L160 154"/><path class="cut" d="M20 154V30H48L48 30 L48.2 31.8 L48.9 33.5 L50.1 34.9 L51.5 36.1 L53.2 36.8 L55 37 L56.8 36.8 L58.5 36.1 L59.9 34.9 L61.1 33.5 L61.8 31.8 L62 30H160L167 36V148L160 154L154 161H96L90 154Z"/><text class="tip" x="55" y="164" font-size="6" text-anchor="middle">voorkant</text><text class="tip" x="125" y="169" font-size="6" text-anchor="middle">achterkant</text><text class="tx" x="100" y="186" font-size="7" text-anchor="middle">Zo maak je hem:</text><text class="tx" x="16" y="198" font-size="6" text-anchor="start">1. Knip de telefoon uit. Een volwassene knipt het venster eruit.</text><text class="tx" x="16" y="208" font-size="6" text-anchor="start">2. Vouw de grijze flapjes naar achteren en smeer er lijm op.</text><text class="tx" x="16" y="218" font-size="6" text-anchor="start">3. Vouw de achterkant achter de voorkant en druk goed aan.</text><text class="tx" x="16" y="228" font-size="6" text-anchor="start">4. Kleur de schermpjes op blad 2, knip ze los en schuif</text><text class="tx" x="22" y="238" font-size="6" text-anchor="start">er eentje van bovenaf in de telefoon. Tring tring!</text><path class="cut" d="M20 275L34 275"/><text class="tip" x="37" y="277" font-size="6" text-anchor="start">knippen</text><path class="fold" d="M72 275L86 275"/><text class="tip" x="89" y="277" font-size="6" text-anchor="start">vouwen</text><rect class="glue" x="124" y="272" width="10" height="6"/><text class="tip" x="137" y="277" font-size="6" text-anchor="start">lijmen</text></svg>
