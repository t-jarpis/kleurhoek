<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="16" font-size="11" text-anchor="middle">Keer, delen en tijd</text><text class="tx" x="100" y="28" font-size="6.2" text-anchor="middle">Is het keer, delen, erbij of eraf? Reken op kladpapier.</text><text class="tx" x="14" y="44" font-size="7" text-anchor="start">1.</text><text class="tx" x="22" y="44" font-size="7" text-anchor="start">Een klas heeft 4 tafels met 6 kinderen aan</text><text class="tx" x="22" y="52" font-size="7" text-anchor="start">elke tafel. Hoeveel kinderen zijn er?</text><rect class="ans" x="156" y="56" width="30" height="11" rx="2"/><text class="tx" x="14" y="80" font-size="7" text-anchor="start">2.</text><text class="tx" x="22" y="80" font-size="7" text-anchor="start">Je koopt 3 ijsjes van 2 euro. Hoeveel betaal</text><text class="tx" x="22" y="88" font-size="7" text-anchor="start">je?</text><rect class="ans" x="156" y="92" width="30" height="11" rx="2"/><text class="tx" x="14" y="116" font-size="7" text-anchor="start">3.</text><text class="tx" x="22" y="116" font-size="7" text-anchor="start">Oma bakt 24 koekjes en verdeelt ze eerlijk</text><text class="tx" x="22" y="124" font-size="7" text-anchor="start">over 4 kleinkinderen. Hoeveel krijgt ieder?</text><rect class="ans" x="156" y="128" width="30" height="11" rx="2"/><text class="tx" x="14" y="152" font-size="7" text-anchor="start">4.</text><text class="tx" x="22" y="152" font-size="7" text-anchor="start">Een trein vertrekt om 9:15 en rijdt 45</text><text class="tx" x="22" y="160" font-size="7" text-anchor="start">minuten. Hoe laat komt hij aan?</text><rect class="ans" x="156" y="164" width="30" height="11" rx="2"/><text class="tx" x="14" y="188" font-size="7" text-anchor="start">5.</text><text class="tx" x="22" y="188" font-size="7" text-anchor="start">Een boek heeft 120 bladzijden. Je hebt er 75</text><text class="tx" x="22" y="196" font-size="7" text-anchor="start">gelezen. Hoeveel moet je nog?</text><rect class="ans" x="156" y="200" width="30" height="11" rx="2"/><text class="tx" x="14" y="224" font-size="7" text-anchor="start">6.</text><text class="tx" x="22" y="224" font-size="7" text-anchor="start">Een pak sap is 1 liter. Je schenkt 4 bekers</text><text class="tx" x="22" y="232" font-size="7" text-anchor="start">van 200 milliliter. Hoeveel milliliter is er</text><text class="tx" x="22" y="240" font-size="7" text-anchor="start">over?</text><rect class="ans" x="156" y="244" width="30" height="11" rx="2"/></svg>
