<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="16" font-size="11" text-anchor="middle">Zo vouw je het vliegtuig</text><path class="l" style="stroke-width:1.2" fill="none" transform="translate(26 30) scale(0.25)" d="M0 0 L200 0 L200 280 L0 280Z"/><path class="fold" transform="translate(26 30) scale(0.25)" d="M100 0V280" style="stroke-width:3.2"/><text class="tx" x="51" y="108" font-size="6" text-anchor="middle">1. Dubbel en weer open</text><path class="l" style="stroke-width:1.2" fill="none" transform="translate(118 30) scale(0.25)" d="M100 0 L200 100 L200 280 L0 280 L0 100Z"/><path class="fold" transform="translate(118 30) scale(0.25)" d="M100 0V100" style="stroke-width:3.2"/><path class="fold" transform="translate(118 30) scale(0.25)" d="M100 0L0 100M100 0L200 100" style="stroke-width:3.2"/><text class="tx" x="143" y="108" font-size="6" text-anchor="middle">2. Hoeken naar het midden</text><path class="l" style="stroke-width:1.2" fill="none" transform="translate(26 114) scale(0.25)" d="M100 0 L200 241 L200 280 L0 280 L0 241Z"/><path class="fold" transform="translate(26 114) scale(0.25)" d="M100 0V241" style="stroke-width:3.2"/><text class="tx" x="51" y="192" font-size="6" text-anchor="middle">3. Randen weer naar het midden</text><path class="l" style="stroke-width:1.2" fill="none" transform="translate(118 114) scale(0.25)" d="M100 0 L100 280 L0 280 L0 241Z"/><text class="tx" x="143" y="192" font-size="6" text-anchor="middle">4. Dubbel vouwen</text><path class="l" style="stroke-width:1.2" fill="none" transform="translate(26 198) scale(0.25)" d="M100 0 L100 280 L75 280 L75 60Z"/><path class="fold" transform="translate(26 198) scale(0.25)" d="M75 60L0 241L0 280L75 280" style="stroke-width:3.2"/><text class="tx" x="51" y="276" font-size="6" text-anchor="middle">5. Vleugels omlaag</text><text class="tx" x="146" y="210" font-size="7" text-anchor="middle">6. Laat hem vliegen!</text></svg>
