<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280"><text class="tx" x="100" y="16" font-size="11" text-anchor="middle">Feestje</text><text class="tx" x="100" y="26" font-size="6" text-anchor="middle">In elk vak mist nog iets. Teken het erbij!</text><rect class="l" x="12" y="32" width="86" height="114" rx="4" style="stroke-width:.8" fill="none"/><text class="tx" x="55" y="42" font-size="6" text-anchor="middle">Teken ballonnen</text><text class="tx" x="55" y="49.5" font-size="6" text-anchor="middle">aan de touwtjes.</text><path class="l" d="M55.0 132Q46.6 102 27.0 76" style="stroke-width:1"/><path class="r" data-i="0" d="M25 78.5 L29 78.5 L27 75.5Z"/><path class="l" d="M55.0 132Q51.4 102 43.0 66" style="stroke-width:1"/><path class="r" data-i="1" d="M41 68.5 L45 68.5 L43 65.5Z"/><path class="l" d="M55.0 132Q56.8 102 61.0 72" style="stroke-width:1"/><path class="r" data-i="2" d="M59 74.5 L63 74.5 L61 71.5Z"/><path class="l" d="M55.0 132Q61.6 102 77.0 64" style="stroke-width:1"/><path class="r" data-i="3" d="M75 66.5 L79 66.5 L77 63.5Z"/><path class="l" d="M55.0 132Q64.0 102 85.0 82" style="stroke-width:1"/><path class="r" data-i="4" d="M83 84.5 L87 84.5 L85 81.5Z"/><path class="r" data-i="5" d="M55.0 132l-6 -3v6Zm0 0l6 -3v6Z"/><rect class="l" x="102" y="32" width="86" height="114" rx="4" style="stroke-width:.8" fill="none"/><text class="tx" x="145" y="42" font-size="6" text-anchor="middle">Versier de taart</text><text class="tx" x="145" y="49.5" font-size="6" text-anchor="middle">en zet er kaarsjes op.</text><ellipse class="r" data-i="6" cx="145" cy="132" rx="38" ry="6"/><path class="r" data-i="7" d="M115.0 130V108H175.0V130Z"/><path class="r" data-i="8" d="M123.0 108V90H167.0V108Z"/><rect class="l" x="12" y="152" width="86" height="114" rx="4" style="stroke-width:.8" fill="none"/><text class="tx" x="55" y="162" font-size="6" text-anchor="middle">Wat zit er</text><text class="tx" x="55" y="169.5" font-size="6" text-anchor="middle">in het cadeau?</text><path 