name: Deploy
# main gaat automatisch naar dev. Productie: handmatig starten met environment=prod; de GitHub-omgeving
# "prod" vraagt dan om goedkeuring. Scaleway kent geen inloggen via OIDC; de GitHub-omgeving heeft
# daarom een API-sleutel van een eigen IAM-applicatie die alleen images mag pushen en containers mag
# bijwerken binnen het project van die omgeving (Terraform maakt hem aan, zie infra/README.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Omgeving
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TARGET_ENV: ${{ inputs.environment || 'dev' }}
  TAG: ${{ github.sha }}

jobs:
  build:
    # Automatisch uitrollen pas zodra Scaleway klaarstaat: zet dan de repository-variabele DEPLOY_ENABLED op true.
    # Handmatig starten kan altijd.
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    strategy:
      matrix:
        app: [api, web, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Inloggen bij de registry
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: echo "$SCW_SECRET_KEY" | docker login "${REGISTRY%%/*}" -u nologin --password-stdin
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.app }}
          platforms: linux/amd64
          push: true
          provenance: false
          # :latest is wat Terraform gebruikt bij het (her)aanmaken van een container; :<commit> rolt uit.
          tags: |
            ${{ vars.REGISTRY }}/kleurhoek-${{ matrix.app }}:${{ env.TAG }}
            ${{ vars.REGISTRY }}/kleurhoek-${{ matrix.app }}:latest
          build-args: NEXT_PUBLIC_MARKETS=${{ vars.MARKETS || 'nl-nl' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
    env:
      REGISTRY: ${{ vars.REGISTRY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      API: https://api.scaleway.com/containers/v1/regions/${{ vars.SCW_REGION || 'nl-ams' }}/containers
      REGISTRY: ${{ vars.REGISTRY }}
      CONTAINER_IDS: ${{ vars.CONTAINER_IDS || '{}' }}
    steps:
      - name: Nieuwe versies uitrollen (eerst de API; die draait bij het opstarten de migraties)
        id: rollout
        run: |
          set -euo pipefail
          if [ "$(jq -r 'length' <<<"$CONTAINER_IDS")" = "0" ]; then
            echo "::notice::Nog geen containers (eerste uitrol): images staan klaar als :latest. Draai nu terraform apply."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          scw() { curl -fsS -H "X-Auth-Token: $SCW_SECRET_KEY" -H "Content-Type: application/json" "$@"; }
          wait_ready() {
            for i in $(seq 1 60); do
              status=$(scw "$API/$1" | jq -r .status)
              echo "  $2: $status"
              case "$status" in
                ready) return 0 ;;
                error) scw "$API/$1" | jq -r '.error_message // empty'; echo "::error::$2 kon niet starten"; return 1 ;;
              esac
              sleep 10
            done
            echo "::error::$2 werd niet op tijd klaar"; return 1
          }
          for app in api web admin; do
            id=$(jq -r --arg a "$app" '.[$a] // empty' <<<"$CONTAINER_IDS")
            [ -n "$id" ] || { echo "::warning::Geen container-ID voor $app"; continue; }
            # Een image-wijziging rolt de container automatisch opnieuw uit.
            scw -X PATCH "$API/$id" -d "{\"image\":\"$REGISTRY/kleurhoek-$app:$TAG\"}" > /dev/null
            sleep 5
            wait_ready "$id" "$app"
          done

      - name: Rooktest
        if: steps.rollout.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.SITE_URL }}/healthz" > /dev/null && curl -fsS -o /dev/null "${{ vars.SITE_URL }}/nl-nl"; then
              echo "Website werkt"; exit 0
            fi
            sleep 10
          done
          echo "::error::Website reageert niet na de deploy"; exit 1
