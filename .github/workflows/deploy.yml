name: Deploy
# main gaat automatisch naar dev. Productie is een aparte actie (ADR 0019, aanvulling): handmatig starten
# met environment=prod; dan gaat precies de versie die op dev draait (en daar door de tests kwam) live, en
# vraagt de GitHub-omgeving "prod" om goedkeuring. Scaleway kent geen inloggen via OIDC; de GitHub-omgeving heeft
# daarom een API-sleutel van een eigen IAM-applicatie die alleen images mag pushen en containers mag
# bijwerken binnen het project van die omgeving (Terraform maakt hem aan, zie infra/README.md).
on:
  # Pas uitrollen als CI (inclusief de browsertest) op main groen is.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Omgeving
        type: choice
        options: [dev, prod]
        default: dev
      ref:
        description: "Commit (leeg = bij prod de versie die nu op dev draait, bij dev de laatste op main)"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TARGET_ENV: ${{ inputs.environment || 'dev' }}

jobs:
  # Eén job: bouwen en uitrollen. Zo vraagt de GitHub-omgeving "prod" maar één keer om goedkeuring.
  release:
    # Automatisch uitrollen pas zodra Scaleway klaarstaat: zet dan de repository-variabele DEPLOY_ENABLED op true.
    # Handmatig starten kan altijd.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      # Laat de rooktests langs de IP-afscherming van de website (ADR 0015).
      SITE_CHECK_KEY: ${{ secrets.SITE_CHECK_KEY }}
      API: https://api.scaleway.com/containers/v1/regions/${{ vars.SCW_REGION || 'nl-ams' }}/containers
      REGISTRY: ${{ vars.REGISTRY }}
      CONTAINER_IDS: ${{ vars.CONTAINER_IDS || '{}' }}
      MARKETS: ${{ vars.MARKETS || 'nl-nl' }}
      BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
    steps:
      - name: Welke versie
        # Automatisch (dev): precies de commit die CI goedkeurde. Prod zonder ref: de laatste versie die op dev
        # met succes is uitgerold, zodat live gaat wat je op dev hebt gezien.
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ -n "$RUN_SHA" ]; then tag="$RUN_SHA"
          elif [ -n "$INPUT_REF" ]; then tag="$INPUT_REF"
          elif [ "$TARGET_ENV" = prod ]; then
            tag="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?event=workflow_run&status=success&per_page=1" -q '.workflow_runs[0].head_sha // empty')"
            [ -n "$tag" ] || { echo "::error::Geen geslaagde uitrol op dev gevonden; geef een commit op bij ref"; exit 1; }
          else tag="$GITHUB_SHA"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "### Versie naar $TARGET_ENV: \`${tag:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 300
      - name: Commits voor de releasenotes (ADR 0023)
        run: |
          git log -300 --format='%H%x1f%cI%x1f%s%x1f%(trailers:key=Release-note,valueonly,separator=%x20)%x1e' | python3 -c '
          import json, sys
          rows = [r.strip("\n").split("\x1f") for r in sys.stdin.read().split("\x1e") if r.strip()]
          json.dump([{"sha": a, "date": b, "subject": c, "note": d.strip()} for a, b, c, d in rows], open("apps/api/release-log.json", "w"), ensure_ascii=False)
          '
          echo "$(python3 -c 'import json;print(len(json.load(open("apps/api/release-log.json"))))') commits in apps/api/release-log.json"
      - uses: docker/setup-buildx-action@v3
      - name: Inloggen bij de registry
        run: echo "$SCW_SECRET_KEY" | docker login "${REGISTRY%%/*}" -u nologin --password-stdin
      - name: Images bouwen en pushen (api, web, admin, login; zie docker-bake.hcl)
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-bake.hcl
          push: true

      - name: Nieuwe versies uitrollen (eerst de API; die draait bij het opstarten de migraties)
        id: rollout
        run: |
          set -euo pipefail
          if [ "$(jq -r 'length' <<<"$CONTAINER_IDS")" = "0" ]; then
            echo "::notice::Nog geen containers (eerste uitrol): images staan klaar als :latest. Draai nu terraform apply."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          scw() { curl -fsS -H "X-Auth-Token: $SCW_SECRET_KEY" -H "Content-Type: application/json" "$@"; }
          wait_ready() {
            for i in $(seq 1 60); do
              status=$(scw "$API/$1" | jq -r .status)
              echo "  $2: $status"
              case "$status" in
                ready) return 0 ;;
                error) scw "$API/$1" | jq -r '.error_message // empty'; echo "::error::$2 kon niet starten"; return 1 ;;
              esac
              sleep 10
            done
            echo "::error::$2 werd niet op tijd klaar"; return 1
          }
          for app in api web admin login; do
            id=$(jq -r --arg a "$app" '.[$a] // empty' <<<"$CONTAINER_IDS")
            [ -n "$id" ] || { echo "::warning::Geen container-ID voor $app"; continue; }
            # Een container die nog bijwerkt weigert een wijziging (409): eerst wachten.
            for i in $(seq 1 30); do
              case "$(scw "$API/$id" | jq -r .status)" in pending|updating|creating|deleting) sleep 10 ;; *) break ;; esac
            done
            # Vorige versie bewaren: bij een mislukte test na de uitrol zetten we die terug.
            echo "$app=$(scw "$API/$id" | jq -r .image)" >> "$GITHUB_OUTPUT.prev"
            # Een image-wijziging rolt de container automatisch opnieuw uit.
            scw -X PATCH "$API/$id" -d "{\"image\":\"$REGISTRY/kleurhoek-$app:$TAG\"}" > /dev/null
            sleep 5
            wait_ready "$id" "$app"
          done
          echo "previous=$(jq -Rn '[inputs | split("=") | {(.[0]): (.[1:] | join("="))}] | add' < "$GITHUB_OUTPUT.prev" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Rooktest
        id: smoke
        if: steps.rollout.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS "${{ vars.SITE_URL }}/healthz" > /dev/null; then
              code=$(curl -sS -o page.html -w '%{http_code}' -H "x-kh-check: ${SITE_CHECK_KEY}" "${{ vars.SITE_URL }}/nl-nl" || echo 000)
              if [ "$code" = 200 ]; then echo "Website werkt"; exit 0; fi
              # Afgeschermd en nog geen controlesleutel: de nieuwe versie antwoordt wel, alleen de pagina's
              # kunnen we niet zien. Geen reden om terug te draaien; de browsertest slaan we over.
              if [ "$code" = 403 ] && [ -z "${SITE_CHECK_KEY}" ] && grep -q "Deze omgeving is afgeschermd" page.html; then
                echo "::warning::De website is afgeschermd met een IP-lijst en SITE_CHECK_KEY ontbreekt: alleen /healthz gecontroleerd. Draai scripts/infra.sh up om de sleutel in te stellen."
                echo "blocked=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Website reageert niet na de deploy"; exit 1

      - name: Browsertest (opmaak geladen, geen JavaScript-fouten)
        if: steps.rollout.outputs.skip != 'true' && steps.smoke.outputs.blocked != 'true'
        run: |
          set -euo pipefail
          .github/diagnose/browser-check.sh "${{ vars.SITE_URL }}/nl-nl" "${{ vars.SITE_URL }}/nl-nl/boekje"

      - name: Terugdraaien naar de vorige versie
        # Rooktest of browsertest mislukt: de vorige images terug, dan blijft de omgeving bruikbaar.
        # Let op: databasemigraties gaan niet terug; die zijn daarom altijd uitbreidend (ADR 0019).
        if: failure() && steps.rollout.outputs.previous != ''
        env:
          PREVIOUS: ${{ steps.rollout.outputs.previous }}
        run: |
          set -euo pipefail
          scw() { curl -fsS -H "X-Auth-Token: $SCW_SECRET_KEY" -H "Content-Type: application/json" "$@"; }
          for app in login admin web api; do
            id=$(jq -r --arg a "$app" '.[$a] // empty' <<<"$CONTAINER_IDS"); image=$(jq -r --arg a "$app" '.[$a] // empty' <<<"$PREVIOUS")
            [ -n "$id" ] && [ -n "$image" ] || continue
            for i in $(seq 1 30); do
              case "$(scw "$API/$id" | jq -r .status)" in pending|updating|creating|deleting) sleep 10 ;; *) break ;; esac
            done
            echo "$app terug naar $image"
            scw -X PATCH "$API/$id" -d "{\"image\":\"$image\"}" > /dev/null
          done
          echo "::error::Uitrol teruggedraaid: de nieuwe versie haalde de test niet. Zie de stappen hierboven."
