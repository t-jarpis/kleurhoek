name: Diagnose
# Toont de status van de containers in een omgeving (zonder geheimen), zodat fouten te zien zijn
# zonder de Scaleway-console. Handmatig starten.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Omgeving
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      API: https://api.scaleway.com/containers/v1/regions/${{ vars.SCW_REGION || 'nl-ams' }}
      CONTAINER_IDS: ${{ vars.CONTAINER_IDS || '{}' }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Containers
        run: |
          set -uo pipefail
          scw() { curl -sS -H "X-Auth-Token: $SCW_SECRET_KEY" "$@"; }
          echo "CONTAINER_IDS: $CONTAINER_IDS"
          for app in api web admin; do
            id=$(jq -r --arg a "$app" '.[$a] // empty' <<<"$CONTAINER_IDS")
            echo "::group::$app ($id)"
            [ -n "$id" ] && scw "$API/containers/$id" | jq '{name, status, error_message, image, min_scale, max_scale, cpu_limit, memory_limit_bytes, public_endpoint, private_endpoint, private_network_id, updated_at, ready_at, env_keys: (.environment_variables|keys), secret_keys: [.secret_environment_variables[]?.key]}'
            echo "::endgroup::"
          done
      - name: Website
        run: |
          for p in healthz nl-nl v1/assets/plates/test/1.svg; do
            printf '%-32s %s\n' "/$p" "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/$p")"
          done
