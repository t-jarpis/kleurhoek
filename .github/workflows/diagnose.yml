name: Diagnose
# Toont de status van de containers in een omgeving (zonder geheimen), zodat fouten te zien zijn
# zonder de Scaleway-console. Handmatig starten.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Omgeving
        type: choice
        options: [dev, prod]
        default: dev
      deep:
        description: "API tijdelijk vervangen door een diagnosescript (migraties met foutmelding); daarna teruggezet"
        type: boolean
        default: false
      hours:
        description: "Logs van de afgelopen … uur"
        type: string
        default: "6"
      grep:
        description: "Alleen regels met deze tekst (regex); leeg = alle regels"
        type: string
        default: "error|warn|fout|mislukt|exception|denied|refused|timeout|unhandled|digest"

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      API: https://api.scaleway.com/containers/v1/regions/${{ vars.SCW_REGION || 'nl-ams' }}
      CONTAINER_IDS: ${{ vars.CONTAINER_IDS || '{}' }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Containers
        run: |
          set -uo pipefail
          scw() { curl -sS -H "X-Auth-Token: $SCW_SECRET_KEY" "$@"; }
          echo "CONTAINER_IDS: $CONTAINER_IDS"
          for app in api web admin login; do
            id=$(jq -r --arg a "$app" '.[$a] // empty' <<<"$CONTAINER_IDS")
            echo "::group::$app ($id)"
            [ -n "$id" ] && scw "$API/containers/$id" | jq '{name, status, error_message, image, min_scale, max_scale, cpu_limit, memory_limit_bytes, public_endpoint, private_endpoint, private_network_id, updated_at, ready_at, env_keys: (.environment_variables|keys)}'
            echo "::endgroup::"
          done
      - name: Domeinen
        # Eigen domeinen per container (Scaleway koppelt ze en haalt een certificaat) en een rechtstreeks
        # verzoek op de origin, buiten Cloudflare om. Zonder geheime header hoort daar 403 uit te komen:
        # dan bereikt het domein de container. Een andere code of een time-out wijst op de koppeling.
        run: |
          set -uo pipefail
          scw() { curl -sS -H "X-Auth-Token: $SCW_SECRET_KEY" "$@"; }
          for app in web admin login; do
            id=$(jq -r --arg a "$app" '.[$a] // empty' <<<"$CONTAINER_IDS")
            [ -n "$id" ] || continue
            endpoint=$(scw "$API/containers/$id" | jq -r '.domain_name // (.public_endpoint | sub("^https://"; ""))')
            ip=$(getent ahostsv4 "$endpoint" | awk 'NR==1{print $1}')
            echo "::group::$app ($endpoint, $ip)"
            scw "$API/domains?container_id=$id" | jq -c '.domains[] | {hostname, status, error_message, url}'
            for host in $(scw "$API/domains?container_id=$id" | jq -r '.domains[].hostname'); do
              printf '%-28s origin: %s\n' "$host" "$(curl -s -m 20 --resolve "$host:443:$ip" -o /dev/null -w '%{http_code} (tls %{ssl_verify_result})' "https://$host/healthz")"
              printf '%-28s origin /: %s\n' "$host" "$(curl -s -m 20 --resolve "$host:443:$ip" -o /dev/null -w '%{http_code}' "https://$host/")"
            done
            echo "::endgroup::"
          done
      - name: Website
        run: |
          for p in healthz nl-nl v1/assets/plates/test/1.svg; do
            printf '%-32s %s\n' "/$p" "$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/$p")"
          done

  logs:
    # Container-logs uit Scaleway Cockpit (alleen lezen). Toont eerst de beschikbare labels, daarna
    # de regels van api, web en admin met een fout of waarschuwing.
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      LOGS_URL: ${{ vars.LOGS_URL }}
      LOGS_TOKEN: ${{ secrets.LOGS_TOKEN }}
      HOURS: ${{ inputs.hours || '6' }}
      GREP: ${{ inputs.grep }}
    steps:
      - name: Logs
        run: |
          set -uo pipefail
          [ -n "$LOGS_URL" ] && [ -n "$LOGS_TOKEN" ] || { echo "::warning::Nog geen LOGS_URL/LOGS_TOKEN: draai scripts/infra.sh up ${{ inputs.environment }}"; exit 0; }
          loki() { curl -fsS -G -H "Authorization: Bearer $LOGS_TOKEN" "$LOGS_URL/loki/api/v1/$1" "${@:2}"; }
          end=$(date +%s)000000000; start=$(( $(date +%s) - HOURS*3600 ))000000000
          echo "::group::labels"; loki labels --data-urlencode "start=$start" --data-urlencode "end=$end" | jq -c .data; echo "::endgroup::"
          for l in resource_name resource_type; do
            echo "::group::$l"; loki "label/$l/values" --data-urlencode "start=$start" --data-urlencode "end=$end" | jq -c .data; echo "::endgroup::"
          done
          for app in api web admin login; do
            echo "------ $app ------"
            loki query_range --data-urlencode "query={resource_name=~\".*$app.*\"}" \
              --data-urlencode "start=$start" --data-urlencode "end=$end" --data-urlencode "limit=300" --data-urlencode "direction=backward" \
              | jq -r '[.data.result[].values[]] | sort_by(.[0]) | .[] | (.[0][0:10] | tonumber | strftime("%H:%M:%S")) + " " + .[1]' \
              | grep -iE "${GREP:-.}" | tail -150 || echo "(geen regels)"
          done

  api-startup:
    # Alleen met deep=true. Vervangt even het startcommando van de API door .github/diagnose/api-startup.js
    # (zelfde image, zelfde geheimen), zet tijdelijk de publieke ingang aan, leest het resultaat met een
    # eenmalige sleutel en zet daarna alles terug.
    if: inputs.deep
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      API: https://api.scaleway.com/containers/v1/regions/${{ vars.SCW_REGION || 'nl-ams' }}
      CONTAINER_IDS: ${{ vars.CONTAINER_IDS || '{}' }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        run: |
          set -euo pipefail
          scw() { curl -fsS -H "X-Auth-Token: $SCW_SECRET_KEY" -H "Content-Type: application/json" "$@"; }
          id=$(jq -r .api <<<"$CONTAINER_IDS")
          for i in $(seq 1 40); do case "$(scw "$API/containers/$id" | jq -r .status)" in pending|updating|creating) sleep 10 ;; *) break ;; esac; done
          scw "$API/containers/$id" > before.json
          key=$(openssl rand -hex 16); echo "::add-mask::$key"
          body=$(jq -n --rawfile js .github/diagnose/api-startup.js --arg k "$key" --slurpfile c before.json '{
            command: ["node", "-e", $js], args: [],
            environment_variables: ($c[0].environment_variables + {DIAG_KEY: $k}),
            enable_default_public_endpoint: true }')
          scw -X PATCH "$API/containers/$id" -d "$body" | jq '{status, command: (.command|length)}'
          ready=""
          for i in $(seq 1 40); do
            sleep 10
            c=$(scw "$API/containers/$id"); st=$(jq -r .status <<<"$c"); echo "status: $st"
            [ "$st" = ready ] && { ready=1; break; }
            [ "$st" = error ] && { jq -r .error_message <<<"$c"; break; }
          done
          url=$(scw "$API/containers/$id" | jq -r .public_endpoint)
          if [ -n "$ready" ] && [ -n "$url" ] && [ "$url" != null ]; then
            for i in $(seq 1 30); do
              out=$(curl -fsS "$url/diag?k=$key" || true)
              echo "$out" | grep -q "klaar" && break; sleep 10
            done
            echo "------ resultaat ------"; echo "$out"
          fi
      - name: Terugzetten
        if: always()
        run: |
          set -euo pipefail
          [ -f before.json ] || exit 0
          id=$(jq -r .api <<<"$CONTAINER_IDS")
          body=$(jq '{command: (.command // []), args: (.args // []), environment_variables, enable_default_public_endpoint: false}' before.json)
          for i in $(seq 1 40); do case "$(curl -fsS -H "X-Auth-Token: $SCW_SECRET_KEY" "$API/containers/$id" | jq -r .status)" in pending|updating|creating) sleep 10 ;; *) break ;; esac; done
          curl -fsS -X PATCH -H "X-Auth-Token: $SCW_SECRET_KEY" -H "Content-Type: application/json" "$API/containers/$id" -d "$body" | jq '{status, public_endpoint, command}'
