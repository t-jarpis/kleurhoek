name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@t-jarpis"
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PLATFORM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - run: pnpm check

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for env in dev prod; do
            terraform -chdir=infra/envs/$env init -backend=false -input=false
            terraform -chdir=infra/envs/$env validate
          done

  docker:
    # Bouwt de images zonder te pushen, zodat een kapotte Dockerfile al in de PR opvalt.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: npmrc voor GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.PLATFORM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" > "$RUNNER_TEMP/npmrc"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          secret-files: npmrc=${{ runner.temp }}/npmrc
          cache-from: type=gha
          cache-to: type=gha,mode=max
